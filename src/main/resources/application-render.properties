# Render proporciona PORT y RENDER_EXTERNAL_URL al servicio web.
server.address=0.0.0.0
server.port=${PORT:10000}
server.forward-headers-strategy=framework
security.jwt.issuer=${RENDER_EXTERNAL_URL:http://localhost:10000}

# Conexión interna a la base administrada, en la misma región.
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Render Key Value es compatible con el cliente Redis del proyecto.
spring.data.redis.url=${REDIS_URL}
spring.data.redis.connect-timeout=5s
spring.data.redis.timeout=5s
spring.cache.type=redis

# Archivo incluido en la imagen. Flyway prepara V1–V8 antes de importarlo.
catalogos.postal.archivo=${SEPOMEX_ARCHIVO:/app/datos/CPdescargatxt.zip}

# La contraseña del proveedor y JWT_SECRET se configuran sólo en Render.
gestopago.auth.password=${GESTOPAGO_PASSWORD}
