server.port=8080
security.jwt.secret=${JWT_SECRET:}
security.jwt.issuer=http://localhost:8080
security.jwt.audience=gestopago-api
security.jwt.ttl-seconds=300
spring.cloud.config.enabled=false

# Configuración de Redis
spring.data.redis.host=127.0.0.1
spring.data.redis.port=6379
spring.data.redis.database=0
# spring.data.redis.password=

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs


spring.datasource.url=jdbc:postgresql://localhost:5432/DBGestoPago
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.schemas=public


# Servicio de Autenticacion GestoPago
gestopago.auth.url=https://gestopago.portalventas.net
gestopago.auth.endpoint=/sistema/app/jwt-gp/authenticate/
gestopago.auth.id-distribuidor=83
gestopago.auth.codigo-dispositivo=GPS83-TPV-17
gestopago.auth.password=${GESTOPAGO_PASSWORD}

# Servicio Externo de Productos GestoPago
gestopago.service.url=https://gestopago.portalventas.net
gestopago.service.endpoint=/sistema/service/getProductList.do
gestopago.service.id-distribuidor=83
gestopago.service.codigo-dispositivo=GPS83-TPV-17
# gestopago.service.token=${GESTOPAGO_TOKEN}
gestopago.service.cron=0 0 3 * * ?
gestopago.productos.cron=0 0 3 * * ?

# Parametros de configuracion OpenFeign (Timeouts y Logging)
spring.cloud.openfeign.client.config.default.connect-timeout=5000
spring.cloud.openfeign.client.config.default.read-timeout=15000
spring.cloud.openfeign.client.config.gestoPagoAuth.connect-timeout=5000
spring.cloud.openfeign.client.config.gestoPagoAuth.read-timeout=10000
spring.cloud.openfeign.client.config.gestoPagoService.connect-timeout=5000
spring.cloud.openfeign.client.config.gestoPagoService.read-timeout=30000
spring.cloud.openfeign.client.config.gestoPagoProduct.connect-timeout=5000
spring.cloud.openfeign.client.config.gestoPagoProduct.read-timeout=30000

# Nivel de logging para rastreo de llamadas de clientes
logging.level.com.proyecto.servicios.client=INFO
spring.cloud.openfeign.client.config.default.loggerLevel=NONE
# Evitar mensajes SQL del driver con valores de CURP, RFC o correo duplicados.
logging.level.org.hibernate.engine.jdbc.spi.SqlExceptionHelper=OFF
catalogos.postal.archivo=${SEPOMEX_ARCHIVO:}

# Política inicial de VALIDACIÓN LOCAL. No habilita envío de pagos.
gestopago.contrato.productos[219].habilitado=true
gestopago.contrato.productos[219].id-servicio=78
gestopago.contrato.productos[219].tipo-front=1
gestopago.contrato.productos[219].id-cat-tipo-servicio=13
gestopago.contrato.productos[219].destino=TELEFONO
gestopago.contrato.productos[219].monto-minimo=40.00
gestopago.contrato.productos[219].monto-maximo=40.00
gestopago.contrato.productos[219].monto-fijo=40.00
gestopago.contrato.productos[219].requiere-referencia=false

# Credenciales externas. Nunca usar las claves de ejemplo del proveedor.
gestopago.auth.basic-authorization=${GESTOPAGO_BASIC_AUTHORIZATION:}
gestopago.token-cache-key-base64=${GESTOPAGO_TOKEN_CACHE_KEY_BASE64:}
gestopago.crypto.secret-base64=${GESTOPAGO_CRYPTO_SECRET_BASE64:}
gestopago.crypto.iv-base64=${GESTOPAGO_CRYPTO_IV_BASE64:}
gestopago.api-key=${GESTOPAGO_API_KEY:}
# Mantener bloqueado hasta integrar reserva, idempotencia y conciliación.
gestopago.payment.enabled=false
gestopago.auth.background-enabled=false
# Evitar trazas de credenciales o cuerpos incluso al diagnosticar el cliente HTTP.
logging.level.org.apache.hc.client5.http.wire=OFF
logging.level.org.apache.hc.client5.http.headers=OFF
