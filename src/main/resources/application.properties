spring.cloud.openfeign.client.config.gestoPagoAuth.connect-timeout=5000
spring.cloud.openfeign.client.config.gestoPagoAuth.read-timeout=10000
spring.cloud.openfeign.client.config.gestoPagoService.connect-timeout=5000
spring.cloud.openfeign.client.config.gestoPagoService.read-timeout=30000
spring.cloud.openfeign.client.config.gestoPagoProduct.connect-timeout=5000
spring.cloud.openfeign.client.config.gestoPagoProduct.read-timeout=30000

# Nivel de logging para rastreo de llamadas de clientes
logging.level.com.proyecto.servicios.client=DEBUG
